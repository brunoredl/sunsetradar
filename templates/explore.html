<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Explore — Sunset Radar</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,600;0,9..144,700;1,9..144,500&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{{ static_url('style.css') }}">
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css">
</head>
<body class="explore-body" data-timezone="{{ default_timezone }}">

<header id="site-header">
  <a href="/" class="brand">
    <svg class="brand-mark" viewBox="0 0 28 28" aria-hidden="true">
      <defs>
        <linearGradient id="logoSun" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="#ffe8c2"/>
          <stop offset="100%" stop-color="#ff8f4d"/>
        </linearGradient>
      </defs>
      <circle cx="14" cy="14" r="12.5" fill="none" stroke="currentColor" stroke-opacity="0.18"/>
      <path d="M8 15 a6 6 0 0 1 12 0 Z" fill="url(#logoSun)"/>
      <path d="M3.5 15 H24.5" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" opacity="0.55"/>
      <path d="M7 19 H21 M9 22 H19" stroke="currentColor" stroke-width="1.1" stroke-linecap="round" opacity="0.25"/>
    </svg>
    <span>SUNSET RADAR</span>
  </a>
  <nav class="site-nav">
    <a href="/" class="nav-link">Tonight</a>
    <a href="/explore" class="nav-link is-active">Explore</a>
  </nav>
</header>

<main class="explore-main">
  <div id="explore-layout">
    <aside id="explore-panel">
      <div class="explore-search">
        <button type="button" id="explore-use-my-location-btn" class="btn-secondary use-location-btn">
          <span class="icon icon-pin" aria-hidden="true"></span> Use my current location
        </button>
        <p class="or-divider">or search by name</p>
        <div class="hero-search-row">
          <label for="explore-where">Where?</label>
          <input type="text" id="explore-where" placeholder="Pustevny, Ostrava, Liberec…" autocomplete="off">
        </div>
        <div class="hero-search-row">
          <label for="explore-radius">Search within</label>
          <input type="range" id="explore-radius" min="5" max="100" step="5" value="25">
          <span id="explore-radius-value" class="hero-search-radius-value">25 km</span>
        </div>
        <button type="button" id="explore-search-btn" class="btn-primary">Search</button>
        <p class="hero-search-status" id="explore-status" hidden></p>
        <p class="hero-search-error" id="explore-error" hidden></p>
      </div>

      <div id="explore-filter-chips" class="filter-chips" hidden>
        <button type="button" class="filter-chip is-active" data-filter="all">All</button>
        <button type="button" class="filter-chip" data-filter="peak">Peaks</button>
        <button type="button" class="filter-chip" data-filter="viewpoint">Viewpoints</button>
        <button type="button" class="filter-chip" data-filter="tower">Towers</button>
        <button type="button" class="filter-chip" data-filter="castle">Castles</button>
        <button type="button" class="filter-chip" data-filter="best">Best sunset</button>
      </div>

      <p class="hint" id="explore-coverage-note" hidden></p>
      <button type="button" id="explore-refresh-results-btn" class="link-btn" hidden>↻ Zkontrolovat nové výsledky</button>
      <div id="explore-results-list" class="explore-results-list"></div>
      <button type="button" id="explore-show-more-candidates-btn" class="btn-secondary" hidden></button>
    </aside>

    <div id="explore-map-frame">
      <div id="explore-map-canvas"></div>
      <div id="explore-preview" class="explore-preview" hidden>
        <button type="button" id="explore-preview-close" class="icon-btn explore-preview-close" aria-label="Zavřít">✕</button>
        <div id="explore-preview-body"></div>
      </div>
    </div>
  </div>
</main>

<script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
<script src="{{ static_url('sunset_viz.js') }}"></script>
<script src="{{ static_url('explore.js') }}"></script>
</body>
</html>
